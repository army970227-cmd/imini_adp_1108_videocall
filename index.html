<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imini 銷量監控</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #000000; padding: 16px; margin: 0; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 5px; color: #000000; }
  .sub { text-align: center; color: #555555; font-size: 12px; margin-bottom: 20px; }
  
  /* 每個成員的區塊 */
  .member-section { margin-bottom: 40px; }
  
  /* 成員標題 */
  .member-title { 
    font-size: 24px; font-weight: bold; text-align: center; 
    margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid #000000;
  }
  .pink { color: #ff69b4; }
  .black { color: #000000; }

  /* 表格樣式 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid #000000; padding: 8px 10px; text-align: center; }
  th { background: #f0f0f0; font-weight: bold; }
  
  /* 增加數量的顏色 */
  .delta { color: #ff0000; font-weight: bold; }
</style>
</head>
<body>
  <h1>ALLDAY PROJECT 'CRASH' 監控</h1>
  <div class="sub" id="time">載入中...</div>
  
  <!-- 這裡會由程式自動生成每個成員的專屬表格 -->
  <div id="members-container"></div>

<script>
// 粉紅名單設定（女生名字）
const pinkMembers = ["YOUNGSEO", "ANNIE", "BAILEY"]; 
// 設定顯示順序
const memberOrder = ["WOOCHAN", "TARZZAN", "YOUNGSEO", "ANNIE", "BAILEY"];

async function load() {
  try {
    const res = await fetch('imini_sales.csv?t=' + Date.now());
    const text = await res.text();
    const lines = text.trim().split('\n');
    
    if (lines.length < 2) {
      document.getElementById('time').innerText = "目前還沒有資料，請等待機器人抓取。";
      return;
    }
    
    const headers = lines[0].split(',');
    const rows = lines.slice(1).map(l => {
      const cols = l.split(',');
      let obj = {};
      headers.forEach((h, i) => obj[h.trim()] = cols[i]);
      return obj;
    });

    document.getElementById('time').innerText = '最後更新：' + rows[rows.length - 1].time;
    
    const container = document.getElementById('members-container');
    container.innerHTML = '';

    // 迴圈處理每一個成員
    memberOrder.forEach(member => {
      // 找出這個成員的所有歷史紀錄
      const memberRows = rows.filter(r => r.member === member);
      
      if (memberRows.length === 0) return;

      // 最新的資料（用來顯示在最上面）
      const latest = memberRows[memberRows.length - 1];
      
      // 判斷名字顏色
      const titleColorClass = pinkMembers.includes(member) ? 'pink' : 'black';

      // 生成表格的 HTML
      let tableHTML = `
        <div class="member-section">
          <div class="member-title ${titleColorClass}">${member}</div>
          
          <!-- 該成員的即時數據摘要 -->
          <div style="text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 16px;">
            目前總銷量：<span style="font-size: 24px;">${latest.total_sold}</span> 張 
            <span style="font-size: 12px; color: #555; font-weight: normal; margin-left: 10px;">(剩餘庫存: ${latest.stock})</span>
          </div>

          <!-- 該成員的歷史紀錄表格 -->
          <table>
            <thead>
              <tr>
                <th>時間</th>
                <th>總銷量</th>
                <th>剩餘庫存</th>
                <th>本次增加</th>
              </tr>
            </thead>
            <tbody>
      `;

      // 將該成員的歷史紀錄反轉（最新的在最上面）
      const reversedMemberRows = [...memberRows].reverse();
      
      reversedMemberRows.forEach(r => {
        const deltaDisplay = r.delta > 0 ? `<span class="delta">+${r.delta}</span>` : `+0`;
        
        tableHTML += `
              <tr>
                <td style="color: #555;">${r.time.split(' ')[1]}</td>
                <td>${r.total_sold}</td>
                <td>${r.stock}</td>
                <td>${deltaDisplay}</td>
              </tr>
        `;
      });

      tableHTML += `
            </tbody>
          </table>
        </div>
      `;

      // 把生成的表格塞進網頁裡
      container.innerHTML += tableHTML;
    });

  } catch (e) { 
    console.error(e);
    document.getElementById('time').innerText = "資料載入失敗";
  }
}
load();
// 每 60 秒自動更新一次
setInterval(load, 60000);
</script>
</body>
</html>
